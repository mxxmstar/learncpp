server:
  host: 127.0.0.1
  port: 8080
  threads: 4

log:
  level: info
  dir: ./logs
  max_file_size_mb: 100
  max_files: 5
  rotation: daily
  console: true
  json_format: false

database:
  enabled: false
  host: localhost
  port: 3306
  name: mydb
  user: root
  password: ""
  pool_size: 10

thread_pool:
  min_threads: 2
  max_threads: 8
  queue_size: 1000

media:
  zlm_host: 127.0.0.1
  zlm_port: 8888
  secret: your_secret
  rtmp_port: 1935
  rtsp_port: 554
