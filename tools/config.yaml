servers:
  mainserver:
    host: 127.0.0.1
    port: 8080
    threads: 4

clients:
  zlm:
    host: 127.0.0.1
    port: 8888
    init_size: 5
    max_size: 20
    connect_timeout_ms: 30000
    idle_timeout_sec: 300
    max_requests_per_client: 100

logs:
  mainlog:
    level: info
    dir: ./logs
    max_file_size_mb: 100
    max_files: 5
    rotation: daily
    console: true
    json_format: false
  errorlog:
    level: error
    dir: ./logs
    max_file_size_mb: 100
    max_files: 5
    rotation: daily
    console: true
    json_format: false

zlm:
  zlm_host: 127.0.0.1
  zlm_port: 8888
  secret: sphrh7r2VafHUILiTVyK3rm1C6hnUYpZ  

websocket:
  host: 127.0.0.1
  port: 8081
  heartbeat_interval: 10
  timeout: 30

camera_db:
  db_path: ./data/camera.db
  host: localhost
  port: 3306
  name: cameras
  user: root
  password: ""
  pool_size: 10

user_db:
  db_path: ./data/user.db
  host: localhost
  port: 3306
  name: users
  user: root
  password: ""
  pool_size: 10